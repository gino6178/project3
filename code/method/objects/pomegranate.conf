# pomegranate. Released by FruitNinja and not used by this project until now; the
# configuration is derived rather than tuned. COARSE_DX is the object's longest extent over 125,
# which is where the orange and the watermelon landed when they were set by hand (129.3 and 120.4).
#
# References repointed to refs_white/. 4 of this object's photographs were shot on a
# dark backdrop; the section loss finds the slice by thresholding against white, so the
# whole frame read as one disc and the render was aligned to the frame's radius rather
# than the slice's. refs_white/ is the same set with the backdrop flooded to white.
SRC=prefilled/trained_gs/pomegranate.ply   # the released model, quantised as it is
COARSE_DX=0.02070
SKIN_FRAC=0.95
CFG=config/orange_physics.json
DEMO=config/sphere_demo
REF_H=data_finetune_images/pomegranate/horizontal
REF_V=refs_white/pomegranate/vertical
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=data_finetune_images/pomegranate/horizontal
EVAL_REF_V=refs_white/pomegranate/vertical
PROMPT="the {view_cut} cross-sectional view of a pomegranate, packed translucent red arils in chambers, pale bitter membrane between them, macro photo, detailed"
CLIP_PROMPT="a cross-section of a pomegranate"
