# bread. Released by FruitNinja and not used by this project until now; the
# configuration is derived rather than tuned. COARSE_DX is the object's longest extent over 125,
# which is where the orange and the watermelon landed when they were set by hand (129.3 and 120.4).
#
# References exist for the transverse family only, which is a property of this
# object: its interior reads differently along the other axis, and no photograph
# of that section is in the repository. What a cut of the other family produces
# is therefore a prediction rather than a fit.
SRC=prefilled/trained_gs/bread.ply   # the released model, quantised as it is
COARSE_DX=0.01310
SKIN_FRAC=0.95
CFG=config/orange_physics.json
DEMO=config/sphere_demo
REF_H=data_finetune_images/bread
REF_V=data_finetune_images/bread
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=data_finetune_images/bread
EVAL_REF_V=data_finetune_images/bread
PROMPT="the {view_cut} cross-sectional view of a cinnamon swirl loaf, pale open crumb, a dark cinnamon spiral, browned crust, macro photo"
CLIP_PROMPT="a slice of cinnamon swirl bread"
