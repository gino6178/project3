# The watermelon. FID 195.5 against the released model's 190.0, from 1,520,021 cells against
# its 7,959,789. The unrefined lattice scored 238.6, and five attempts on the appearance rather
# than the geometry all left it between 238 and 266 -- see ../README.md.
#
# This used to recover the surface and re-run the paper's fill, because quantising the released
# model directly left holes in the skin. That was true of an unrefined lattice; refined, direct
# quantisation covers 97.9% of the silhouette against the recover-and-refill route's 97.0%.
SRC=prefilled/trained_gs/watermelon.ply   # the released model, quantised as it is
COARSE_DX=0.01722
CFG=config/watermelon_raw_physics.json
DEMO=config/watermelon_demo
REF_H=secref_wm_h1
REF_V=secref_wm_v1
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=data_finetune_images/watermelon/horizontal          # the photographs, not the training reference
PROMPT="the {view_cut} cross-sectional view of a watermelon, red flesh with scattered black seeds, white pith and green rind, macro photo, detailed"
CLIP_PROMPT="a cross-section of a watermelon"
REFS6=cube_wm3_prep                     # the six exterior views: the skin is projected from these,
                                      # and EXT_DIRS supervises against the same images
EVAL_REF_V=data_finetune_images/watermelon/vertical           # the longitudinal photographs
