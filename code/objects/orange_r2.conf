# The orange by the second route: shape from its equation, appearance from the six views.
# Half-axes are the released model's own at the 98th percentile about its median,
# isotropy 0.971.
# The orange. FID 79.1 against the released model's 102.6, from 877,495 cells against its
# 3,928,330 -- and against the 898,563 the unrefined lattice used, so the refinement costs
# nothing here: a coarser interior pays for the finer skin.
SRC=ellipsoid
SHAPE_ARGS="--radii 0.6155 0.6339 0.6231"
COARSE_DX=0.01180
CFG=config/orange_physics.json
DEMO=config/sphere_demo
REF_H=secref_orraw_hsep
REF_V=secref_orraw_vsep
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=secref_orraw_hsep          # the same photographs training saw, so this is a fit, not a held-out score;
                                        # see evaluate/README.md
PROMPT="the {view_cut} cross-sectional view of a navel orange, white central pith core, white radial segment membranes, translucent juice vesicles, macro photo, detailed"
CLIP_PROMPT="a cross-section of an orange"
REFS6=cube_or6_prep                     # the six exterior views: the skin is projected from these,
                                      # and EXT_DIRS supervises against the same images
EVAL_REF_V=secref_orraw_vsep                                  # the longitudinal photographs
