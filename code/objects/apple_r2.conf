# The apple by the second route. Half-axes 0.6796, 0.6601, 0.6048 from the released model at the
# 98th percentile about its median, isotropy 0.890.
#
# Its six views do not exist as a generated set, so they are rendered off the released model by
# ply_six_refs.py -- for an object whose exterior is already reconstructed, a render of it is a
# better reference than a photograph of a different apple, and that file says why.
SRC=ellipsoid
SHAPE_ARGS="--radii 0.6796 0.6601 0.6048"
COARSE_DX=0.01230
CFG=config/orange_physics.json
DEMO=config/sphere_demo
REF_H=refs_white/apple/horizontal
REF_V=data_finetune_images/apple/vertical
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=refs_white/apple/horizontal
EVAL_REF_V=data_finetune_images/apple/vertical
PROMPT="the {view_cut} cross-sectional view of an apple, pale cream flesh, a five-pointed core of dark seeds, thin red skin, macro photo, detailed"
CLIP_PROMPT="a cross-section of an apple"
REFS6=cube_ap_prep
