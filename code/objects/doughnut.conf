# The doughnut. No released model to compare against -- the published dataset is entirely genus
# zero -- and one reference image per family, too few for FID. Its geometry is generated rather
# than captured, and its lattice was already built at refine=2, which is why it needed no
# rebuild when the orange and the watermelon did.
SRC=torus                             # generated from its equation, not stored. This used to
                                      # name a 104 MB lattice directory built from a torus.obj
                                      # that is not on disk and was never in this repository --
                                      # so this object could not be run by anyone but me. The
                                      # parameters below are that lattice's own, measured off it:
                                      # axis z, 0.5232 to the tube's centre, tube radius 0.1856.
SHAPE_ARGS="--radius 0.5232 --tube 0.1856 --axis 2"
COARSE_DX=0.00832
CFG=config/torus_physics.json
DEMO=config/torus_demo
REF_H=secref_dn2_h
REF_V=secref_dn2_v
ITERS=${ITERS:-200}                            # generated references, crumb converges quickly
SCORE=topology
PROMPT="the {view_cut} cross-sectional view of a glazed doughnut, bread crumb interior, pink icing on the surface, macro photo, detailed"
CLIP_PROMPT="a cross-section of a doughnut"
REFS6=cube_donut3_prep                     # the six exterior views: the skin is projected from these,
                                      # and EXT_DIRS supervises against the same images
