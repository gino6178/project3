# cake. Released by FruitNinja and not used by this project until now; the
# configuration is derived rather than tuned. COARSE_DX is the object's longest extent over 125,
# which is where the orange and the watermelon landed when they were set by hand (129.3 and 120.4).
#
# References exist for the longitudinal family only, which is a property of this
# object: its interior reads differently along the other axis, and no photograph
# of that section is in the repository. What a cut of the other family produces
# is therefore a prediction rather than a fit.
#
# References repointed to refs_white/. 3 of this object's photographs were shot on a
# dark backdrop; the section loss finds the slice by thresholding against white, so the
# whole frame read as one disc and the render was aligned to the frame's radius rather
# than the slice's. refs_white/ is the same set with the backdrop flooded to white.
SRC=prefilled/trained_gs/cake.ply   # the released model, quantised as it is
COARSE_DX=0.01616
CFG=config/orange_physics.json
# The polar axis. CFG above is the orange's physics file, as every object's is, and this
# object's released model does not stand the way the orange's does: turning about the
# orange's axis leaves 0.746 of this solid covering itself, and turning about this one leaves
# 0.956. Under the inherited axis the family called transverse cuts along the object.
UP_AXIS=0,0,1
DEMO=config/sphere_demo
REF_H=refs_white/cake
REF_V=refs_white/cake
ITERS=${ITERS:-200}
SCORE=topology
EVAL_REF=refs_white/cake
EVAL_REF_V=refs_white/cake
PROMPT="the {view_cut} cross-sectional view of a red velvet layer cake, dark red sponge layers separated by white cream, macro photo"
CLIP_PROMPT="a slice of red velvet cake"
