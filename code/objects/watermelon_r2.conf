# The watermelon by the second route: the shape is generated from its equation and the
# appearance is projected from six views, so nothing of the released reconstruction is used
# except as the source those six views were rendered from. The interior is trained exactly as
# route 1 trains it, against the same photographs.
#
# The ellipsoid's half-axes are the released model's own, at the 98th percentile of |x| about
# its median so a few stray primitives do not set them: 0.8966, 0.8277, 0.9085. Isotropy 0.911,
# which is why this is an ellipsoid and not a sphere.
SRC=ellipsoid
SHAPE_ARGS="--radii 0.8966 0.8277 0.9085"
COARSE_DX=0.01722
CFG=config/watermelon_raw_physics.json
DEMO=config/watermelon_demo
REF_H=data_finetune_images/watermelon/horizontal
REF_V=data_finetune_images/watermelon/vertical
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=data_finetune_images/watermelon/horizontal   # the same photographs training saw, so this is a fit
EVAL_REF_V=data_finetune_images/watermelon/vertical
PROMPT="the {view_cut} cross-sectional view of a watermelon, red flesh with scattered black seeds, white pith and green rind, macro photo, detailed"
CLIP_PROMPT="a cross-section of a watermelon"
REFS6=cube_wm3_prep
