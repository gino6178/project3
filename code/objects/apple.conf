# apple. Released by FruitNinja and not used by this project until now; the
# configuration is derived rather than tuned. COARSE_DX is the object's longest extent over 125,
# which is where the orange and the watermelon landed when they were set by hand (129.3 and 120.4).
#
# References repointed to refs_white/. 1 of this object's photographs were shot on a
# dark backdrop; the section loss finds the slice by thresholding against white, so the
# whole frame read as one disc and the render was aligned to the frame's radius rather
# than the slice's. refs_white/ is the same set with the backdrop flooded to white.
SRC=prefilled/trained_gs/apple.ply   # the released model, quantised as it is
COARSE_DX=0.01230
CFG=config/orange_physics.json
# The polar axis. CFG above is the orange's physics file, as every object's is, and this
# object's released model does not stand the way the orange's does: turning about the
# orange's axis leaves 0.906 of this solid covering itself, and turning about this one leaves
# 0.945. Under the inherited axis the family called transverse cuts along the object.
UP_AXIS=0,0,1
DEMO=config/sphere_demo
REF_H=refs_white/apple/horizontal
REF_V=data_finetune_images/apple/vertical
ITERS=${ITERS:-200}
SCORE=fid
EVAL_REF=refs_white/apple/horizontal
EVAL_REF_V=data_finetune_images/apple/vertical
PROMPT="the {view_cut} cross-sectional view of an apple, pale cream flesh, a five-pointed core of dark seeds, thin red skin, macro photo, detailed"
CLIP_PROMPT="a cross-section of an apple"
